; 前端测试的事中画面：Xvfb + x11vnc（只读）+ noVNC。
; 只在容器内回环监听，对外统一由 nginx 8080 的 /vnc/ 提供。
[program:playwright-live-view]
command=/bin/bash /usr/local/share/harness/playwright/live-view.sh
directory=/usr/local/share/harness/playwright
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
environment=DISPLAY=":99"
stdout_logfile=/var/log/supervisor/playwright-live-view.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true
