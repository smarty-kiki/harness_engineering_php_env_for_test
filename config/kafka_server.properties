# harness：单机开发环境的 broker 覆盖项，构建时追加在出厂 server.properties 之后（不整份替换，避免跟不上版本变化）

# 数据目录从出厂的 /tmp/kraft-combined-logs 挪到 /var/lib/kafka，与容器里其他服务的数据目录一致；
# broker 自己的运行日志在 /var/log/kafka，由 init 脚本用 LOG_DIR 指定（与数据目录分开）
log.dirs=/var/lib/kafka

# 开发环境允许按需自动建 topic（第一次投递时建，分区数取下面的 num.partitions），省掉手工建 topic 的步骤；
# 生产环境不要开这项：名字写错时会静默建出一个没人监听的 topic，topic 应当显式创建
auto.create.topics.enable=true
num.partitions=3
