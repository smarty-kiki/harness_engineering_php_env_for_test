<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试观测台</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --border: #d9dde3;
        --text: #1f2328;
        --muted: #57606a;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
        --ok: #1a7f37;
        --ok-soft: #dafbe1;
        --warn: #9a6700;
        --warn-soft: #fff8c5;
        --err: #cf222e;
        --err-soft: #ffebe9;
        --shadow: 0 1px 0 rgba(31, 35, 40, .04), 0 1px 3px rgba(31, 35, 40, .06);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --accent-soft: #0c2d6b;
            --ok: #3fb950;
            --ok-soft: #12261e;
            --warn: #d29922;
            --warn-soft: #2a2118;
            --err: #f85149;
            --err-soft: #3c1618;
            --shadow: none;
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
    }

    .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px 48px;
    }

    header { margin-bottom: 24px; }

    header h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: .2px;
    }

    header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
    }

    .section-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 26px 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .live-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
    }

    .live-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 18px;
    }

    .live-copy { min-width: 0; }

    .live-copy strong {
        display: block;
        font-size: 15px;
        line-height: 1.4;
    }

    .live-copy span {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
    }

    .live-row .btn { margin-left: auto; }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        line-height: 1.4;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: border-color .12s ease, background .12s ease, color .12s ease;
    }

    .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
    }

    .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
    }

    .btn.primary:hover {
        filter: brightness(1.05);
        color: #fff;
    }

    .runs {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .run {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .run-row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 13px 16px;
    }

    .run-main { min-width: 0; flex: 1; }

    .run-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        color: var(--muted);
        font-size: 12.5px;
    }

    .run-id {
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        word-break: break-all;
    }

    .run-error {
        margin-top: 5px;
        color: var(--err);
        font-size: 12.5px;
        line-height: 1.5;
        word-break: break-word;
    }

    .run-note {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12.5px;
    }

    .run-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        flex: 0 0 auto;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
    }

    .badge.ok { color: var(--ok); background: var(--ok-soft); }
    .badge.err { color: var(--err); background: var(--err-soft); }
    .badge.warn { color: var(--warn); background: var(--warn-soft); }
    .badge.dim { color: var(--muted); background: var(--bg); border: 1px solid var(--border); }

    .steps-panel {
        border-top: 1px dashed var(--border);
        padding: 11px 16px 14px;
        background: color-mix(in srgb, var(--bg) 55%, var(--panel));
    }

    .steps-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
    }

    .steps-head code {
        font-family: var(--mono);
        color: var(--text);
        word-break: break-all;
    }

    .steps-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 340px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
    }

    .step {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 5px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 12.5px;
    }

    .step:last-child { border-bottom: 0; }

    .step-icon {
        width: 16px;
        flex: 0 0 16px;
        text-align: center;
        color: var(--ok);
        font-weight: 700;
    }

    .step.error .step-icon { color: var(--err); }
    .step.error .step-name { color: var(--err); }

    .step-name { min-width: 0; flex: 1; word-break: break-word; }

    .step-time {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11.5px;
        white-space: nowrap;
    }

    .run-issues {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
    }

    .run-issues strong { color: var(--err); }

    .run-issues ul {
        margin: 4px 0 0;
        padding-left: 18px;
    }

    .empty {
        padding: 28px 16px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
    }

    footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
    }

    @media (max-width: 760px) {
        .wrap { padding: 22px 14px 36px; }
        .live-row { align-items: flex-start; flex-wrap: wrap; }
        .live-row .btn { margin-left: 50px; }
        .run-row { flex-direction: column; gap: 10px; }
        .run-actions { justify-content: flex-start; width: 100%; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>测试观测台</h1>
        <p>实时画面 · 测试用例与测试轮次 · 每轮 Trace / 覆盖率报告</p>
    </header>

    <div class="section-title">实时画面</div>
    <div class="live-row">
        <span class="live-icon">◉</span>
        <div class="live-copy">
            <strong>只读实时画面</strong>
            <span>playwright-run 执行时可直接观察浏览器操作，不可远程接管。</span>
        </div>
        <a class="btn primary" href="/vnc/vnc.html?autoconnect=true&resize=scale&view_only=true">打开实时画面</a>
    </div>

    <div class="section-title">测试用例及测试轮次</div>
    <div class="runs" id="runs">
        <div class="empty">正在读取运行记录…</div>
    </div>

    <footer>每一轮独立归档；历史轮次可直接回看 Trace 与覆盖率报告。</footer>
</div>

<script>
(function () {
    var runsBox = document.getElementById('runs');
    var metas = [];

    function esc(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function absoluteTime(value) {
        if (!value) { return ''; }
        var date = new Date(value);
        if (isNaN(date.getTime())) { return String(value); }
        return date.toLocaleString('zh-CN', { hour12: false });
    }

    function durationText(meta) {
        var start = new Date(meta.started_at).getTime();
        var end = new Date(meta.finished_at).getTime();

        if (!isFinite(start) || !isFinite(end) || end < start) { return ''; }

        var seconds = Math.round((end - start) / 1000);

        if (seconds < 60) { return seconds + ' 秒'; }

        return Math.floor(seconds / 60) + ' 分 ' + (seconds % 60) + ' 秒';
    }

    function durationMs(value) {
        var ms = Number(value);

        if (!isFinite(ms) || ms < 0) { return ''; }
        if (ms < 1000) { return ms + 'ms'; }

        return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's';
    }

    function statusBadge(meta) {
        if (!meta) { return '<span class="badge warn">未完成</span>'; }
        if (meta.error) { return '<span class="badge err">失败</span>'; }
        return '<span class="badge ok">成功</span>';
    }

    function stepStats(meta) {
        var steps = meta && Array.isArray(meta.steps) ? meta.steps : [];
        var passed = steps.filter(function (step) { return step.status === 'ok'; }).length;
        var failed = steps.length - passed;
        var rate = steps.length > 0 ? (passed / steps.length * 100) : 0;

        return {
            total: steps.length,
            passed: passed,
            failed: failed,
            rate: rate,
            rateLabel: steps.length > 0 ? rate.toFixed(2) + '%' : '—',
        };
    }

    function runRow(run, index) {
        var meta = run.meta;
        var parts = [];
        var errorLine = '';

        parts.push('<span class="run-id">' + esc(run.name) + '</span>');
        parts.push(statusBadge(meta));

        if (meta) {
            var duration = durationText(meta);
            if (duration) { parts.push('<span>' + esc(duration) + '</span>'); }

            var started = absoluteTime(meta.started_at);
            if (started) { parts.push('<span>' + esc(started) + '</span>'); }

            var stats = stepStats(meta);
            if (stats.total > 0) {
                parts.push('<span class="badge ' + (stats.failed ? 'err' : 'ok') + '">用例通过率 ' + esc(stats.rateLabel) + '（' + stats.passed + '/' + stats.total + '）</span>');
            }

            var lines = meta.coverage && meta.coverage.totals && meta.coverage.totals.lines;
            if (lines && lines.pct) { parts.push('<span>前端行覆盖 ' + esc(lines.pct) + '</span>'); }

            if (meta.error) {
                errorLine = '<div class="run-error">失败于：' + esc(meta.error.step || '未知步骤');
                if (meta.error.message) { errorLine += ' · ' + esc(meta.error.message); }
                errorLine += '</div>';
            }
        } else {
            errorLine = '<div class="run-note">该轮次没有生成 meta.json（可能被中断），无法回看步骤与结果。</div>';
        }

        var actions = [];

        if (meta) {
            var traceHref = '/trace/index.html?trace=' + encodeURIComponent('/artifacts/runs/' + run.name + '/trace.zip');
            actions.push('<a class="btn" href="' + traceHref + '" target="_blank" rel="noopener">Trace Viewer</a>');
            actions.push('<button class="btn" type="button" data-steps="' + index + '" aria-expanded="false">测试用例（' + (meta.steps ? meta.steps.length : 0) + '）</button>');
            actions.push('<a class="btn" href="/artifacts/runs/' + encodeURIComponent(run.name) + '/report/index.html" target="_blank" rel="noopener">覆盖率报告</a>');
        } else {
            actions.push('<a class="btn" href="/artifacts/runs/' + encodeURIComponent(run.name) + '/" target="_blank" rel="noopener">产物目录</a>');
        }

        return '<article class="run" data-run-index="' + index + '">'
            + '<div class="run-row">'
            + '<div class="run-main"><div class="run-head">' + parts.join('') + '</div>' + errorLine + '</div>'
            + '<div class="run-actions">' + actions.join('') + '</div>'
            + '</div>'
            + '<div class="steps-panel" hidden></div>'
            + '</article>';
    }

    function renderSteps(meta) {
        var steps = Array.isArray(meta.steps) ? meta.steps : [];
        var stats = stepStats(meta);

        var html = '<div class="steps-head">'
            + '<span>测试用例通过率 <strong>' + esc(stats.rateLabel) + '</strong>（' + stats.passed + '/' + stats.total + '）</span>'
            + '<span>失败 ' + stats.failed + '</span>'
            + '<span>流程文件：<code>' + esc(meta.flow || '未记录') + '</code></span>'
            + '</div>';

        if (steps.length === 0) {
            html += '<div class="run-note">该轮次没有记录步骤。</div>';
        } else {
            html += '<ol class="steps-list">';
            for (var i = 0; i < steps.length; i++) {
                var step = steps[i];
                var failed = step.status && step.status !== 'ok';
                html += '<li class="step' + (failed ? ' error' : '') + '">'
                    + '<span class="step-icon">' + (failed ? '✕' : '✓') + '</span>'
                    + '<span class="step-name">' + esc(step.name) + '</span>'
                    + '<span class="step-time">' + esc(durationMs(step.duration_ms)) + '</span>'
                    + '</li>';
            }
            html += '</ol>';
        }

        var pageErrors = Array.isArray(meta.page_errors) ? meta.page_errors : [];
        var consoleErrors = Array.isArray(meta.console_errors) ? meta.console_errors : [];

        if (pageErrors.length || consoleErrors.length) {
            html += '<div class="run-issues"><strong>运行期错误</strong><ul>';
            pageErrors.forEach(function (item) {
                html += '<li>页面：' + esc(item.page_url || '') + ' · ' + esc(item.message || '') + '</li>';
            });
            consoleErrors.forEach(function (item) {
                html += '<li>Console：' + esc(typeof item === 'string' ? item : (item.text || JSON.stringify(item))) + '</li>';
            });
            html += '</ul></div>';
        }

        return html;
    }

    function bindSteps() {
        runsBox.addEventListener('click', function (event) {
            var button = event.target.closest('[data-steps]');
            if (!button) { return; }

            var index = Number(button.getAttribute('data-steps'));
            var meta = metas[index];
            var article = button.closest('.run');
            var panel = article.querySelector('.steps-panel');
            var expanded = button.getAttribute('aria-expanded') === 'true';

            if (!meta) { return; }

            if (expanded) {
                panel.hidden = true;
                button.setAttribute('aria-expanded', 'false');
                button.textContent = '测试用例（' + (meta.steps ? meta.steps.length : 0) + '）';
                return;
            }

            if (!panel.dataset.rendered) {
                panel.innerHTML = renderSteps(meta);
                panel.dataset.rendered = '1';
            }

            panel.hidden = false;
            button.setAttribute('aria-expanded', 'true');
            button.textContent = '收起测试用例';
        });
    }

    function fetchMeta(name) {
        return fetch('/artifacts/runs/' + encodeURIComponent(name) + '/meta.json', { cache: 'no-store' })
            .then(function (resp) { return resp.ok ? resp.json() : null; })
            .catch(function () { return null; });
    }

    function loadRuns() {
        fetch('/runs-json/', { cache: 'no-store' })
            .then(function (resp) {
                if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
                return resp.json();
            })
            .then(function (entries) {
                var names = (Array.isArray(entries) ? entries : [])
                    .filter(function (entry) { return entry && entry.type === 'directory' && entry.name; })
                    .map(function (entry) { return entry.name; })
                    .sort()
                    .reverse();

                return Promise.all(names.map(function (name) {
                    return fetchMeta(name).then(function (meta) { return { name: name, meta: meta }; });
                }));
            })
            .then(function (runs) {
                metas = runs.map(function (run) { return run.meta; });

                if (runs.length === 0) {
                    runsBox.innerHTML = '<div class="empty">还没有运行记录，执行一次 playwright-run 后这里会出现测试轮次。</div>';
                    return;
                }

                runsBox.innerHTML = runs.map(runRow).join('');
                bindSteps();
            })
            .catch(function (err) {
                runsBox.innerHTML = '<div class="empty">运行记录读取失败：' + esc(err.message) + '</div>';
            });
    }

    loadRuns();
})();
</script>
</body>
</html>
