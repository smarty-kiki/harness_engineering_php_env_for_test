<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试观测台</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --border: #d9dde3;
        --text: #1f2328;
        --muted: #57606a;
        --accent: #0969da;
        --accent-soft: #ddf4ff;
        --ok: #1a7f37;
        --ok-soft: #dafbe1;
        --warn: #9a6700;
        --warn-soft: #fff8c5;
        --err: #cf222e;
        --err-soft: #ffebe9;
        --shadow: 0 1px 0 rgba(31, 35, 40, .04), 0 1px 3px rgba(31, 35, 40, .06);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --accent-soft: #0c2d6b;
            --ok: #3fb950;
            --ok-soft: #12261e;
            --warn: #d29922;
            --warn-soft: #2a2118;
            --err: #f85149;
            --err-soft: #3c1618;
            --shadow: none;
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
    }

    .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px 48px;
    }

    header { margin-bottom: 24px; }

    header h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: .2px;
    }

    header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
    }

    .section-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 26px 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .live-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
    }

    .live-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 18px;
    }

    .live-copy { min-width: 0; }

    .live-copy strong {
        display: block;
        font-size: 15px;
        line-height: 1.4;
    }

    .live-copy span {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
    }

    .live-row .btn { margin-left: auto; }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        line-height: 1.4;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: border-color .12s ease, background .12s ease, color .12s ease;
    }

    .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-soft);
    }

    .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
    }

    .btn.primary:hover {
        filter: brightness(1.05);
        color: #fff;
    }

    .runs {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .run {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .run.active {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }

    .run-row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 13px 16px;
    }

    .run-main { min-width: 0; flex: 1; }

    .run-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        color: var(--muted);
        font-size: 12.5px;
    }

    .run-id {
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        word-break: break-all;
    }

    .run-error {
        margin-top: 5px;
        color: var(--err);
        font-size: 12.5px;
        line-height: 1.5;
        word-break: break-word;
    }

    .run-note,
    .round-detail {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
        word-break: break-word;
    }

    .round-detail strong { color: var(--text); font-weight: 600; }

    .run-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        flex: 0 0 auto;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
    }

    .badge.ok { color: var(--ok); background: var(--ok-soft); }
    .badge.err { color: var(--err); background: var(--err-soft); }
    .badge.warn { color: var(--warn); background: var(--warn-soft); }
    .badge.dim { color: var(--muted); background: var(--bg); border: 1px solid var(--border); }

    .badge.live {
        color: var(--accent);
        background: var(--accent-soft);
    }

    .badge.live::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: badge-pulse 1.4s ease-in-out infinite;
    }

    @keyframes badge-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .25; }
    }

    .layers {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
    }

    .layer-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        padding: 2px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--bg);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
    }

    .layer-chip strong {
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
    }

    .layer-chip em {
        color: var(--err);
        font-style: normal;
        font-size: 11.5px;
    }

    .layer-chip.running {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
    }

    .layer-chip.running strong { color: var(--accent); }
    .layer-chip.done { border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
    .layer-chip.done strong { color: var(--ok); }
    .layer-chip.failed { border-color: var(--err); background: var(--err-soft); }
    .layer-chip.failed strong { color: var(--err); }
    .layer-chip.skipped { opacity: .6; }
    .layer-chip.pending { border-style: dashed; }

    .steps-panel {
        border-top: 1px dashed var(--border);
        padding: 11px 16px 14px;
        background: color-mix(in srgb, var(--bg) 55%, var(--panel));
    }

    .steps-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
    }

    .steps-head strong { color: var(--text); }

    .steps-head code {
        font-family: var(--mono);
        color: var(--text);
        word-break: break-all;
    }

    .steps-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 340px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
    }

    .step {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 5px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 12.5px;
    }

    .step:last-child { border-bottom: 0; }

    .step-icon {
        width: 16px;
        flex: 0 0 16px;
        text-align: center;
        color: var(--ok);
        font-weight: 700;
    }

    .step.error .step-icon { color: var(--err); }
    .step.error .step-name { color: var(--err); }

    .step-name { min-width: 0; flex: 1; word-break: break-word; }

    .step-time {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11.5px;
        white-space: nowrap;
    }

    .case-layer + .case-layer { margin-top: 10px; }

    .case-layer-title {
        margin: 8px 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
    }

    .case-failure,
    .case-note {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        line-height: 1.45;
        word-break: break-word;
    }

    .case-failure { color: var(--err); }
    .case-note { color: var(--muted); }
    .case-note.err { color: var(--err); }
    .case-note.ok { color: var(--ok); }

    .step.not-run .step-icon { color: var(--warn); }

    .run-issues {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
    }

    .run-issues > strong { color: var(--text); }
    .run-issues ul { color: var(--err); }

    .run-issues ul {
        margin: 4px 0 0;
        padding-left: 18px;
    }

    .run-issues .ok-text { color: var(--ok); }

    .empty {
        padding: 28px 16px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
    }

    footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
    }

    @media (max-width: 760px) {
        .wrap { padding: 22px 14px 36px; }
        .live-row { align-items: flex-start; flex-wrap: wrap; }
        .live-row .btn { margin-left: 50px; }
        .run-row { flex-direction: column; gap: 10px; }
        .run-actions { justify-content: flex-start; width: 100%; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>测试观测台</h1>
        <p>实时画面 · 测试轮次（编写 / 执行 / 报告） · 每轮完整覆盖率与 Trace</p>
    </header>

    <div class="section-title">实时画面</div>
    <div class="live-row">
        <span class="live-icon">◉</span>
        <div class="live-copy">
            <strong>只读实时画面</strong>
            <span>有头运行 playwright-run 时可直接观察浏览器操作，不可远程接管；无头运行不会显示画面。</span>
        </div>
        <a class="btn primary" href="/vnc/vnc.html?autoconnect=true&resize=scale&view_only=true">打开实时画面</a>
    </div>

    <div class="section-title">测试轮次</div>
    <div class="runs" id="runs">
        <div class="empty">正在读取测试轮次…</div>
    </div>

    <footer>轮次从编写用例时开始记录，执行过程中自动刷新；历史轮次可回看 Trace、覆盖率与全量测试报告。</footer>
</div>

<script>
(function () {
    var runsBox = document.getElementById('runs');
    var items = [];
    var expanded = {};
    var signature = '';
    var loading = false;
    var timer = null;
    var runCache = {};
    var omittedLegacy = 0;
    var MAX_LEGACY_RUNS = 8;

    var ACTIVE_STATES = ['planning', 'preparing', 'seeding', 'frontend', 'api', 'cli', 'coverage', 'reporting'];
    var STATE_LABELS = {
        planning: '编写用例中',
        preparing: '准备环境中',
        seeding: '造数中',
        frontend: '前端测试中',
        api: '接口测试中',
        cli: 'CLI 测试中',
        coverage: '统计覆盖率',
        reporting: '生成报告中',
        done: '已完成',
        failed: '失败',
        interrupted: '已中断'
    };
    var LAYER_LABELS = { frontend: '前端', api: '接口', cli: 'CLI' };
    var LAYER_STATES = { pending: '等待', running: '执行中', done: '已完成', failed: '失败', skipped: '未包含' };

    function esc(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function absoluteTime(value) {
        if (!value) { return ''; }
        var date = new Date(value);
        if (isNaN(date.getTime())) { return String(value); }
        return date.toLocaleString('zh-CN', { hour12: false });
    }

    function clockTime(value) {
        if (!value) { return ''; }
        var date = new Date(value);
        if (isNaN(date.getTime())) { return ''; }
        return date.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function durationText(seconds) {
        if (!isFinite(seconds) || seconds < 0) { return ''; }
        seconds = Math.round(seconds);
        if (seconds < 60) { return seconds + ' 秒'; }
        return Math.floor(seconds / 60) + ' 分 ' + (seconds % 60) + ' 秒';
    }

    function durationMs(value) {
        var ms = Number(value);

        if (!isFinite(ms) || ms < 0) { return ''; }
        if (ms < 1000) { return ms + 'ms'; }

        return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's';
    }

    function startTime(value) {
        var time = new Date(value).getTime();
        return isFinite(time) ? time : 0;
    }

    function isActiveRound(status) {
        return status && ACTIVE_STATES.indexOf(status.state) >= 0;
    }

    function stateLabel(status) {
        return status.state_label || STATE_LABELS[status.state] || status.state || '未知状态';
    }

    function roundStateClass(status) {
        if (status.state === 'done') { return 'ok'; }
        if (status.state === 'failed' || status.state === 'interrupted') { return 'err'; }
        return 'live';
    }

    function pctText(value) {
        return value === null || value === undefined || !isFinite(Number(value))
            ? '—'
            : Number(value).toFixed(2) + '%';
    }

    function numberValue(value) {
        var number = Number(value);
        return isFinite(number) ? number : null;
    }

    function totalsOf(status) {
        if (status.totals && numberValue(status.totals.total) > 0) { return status.totals; }

        var totals = { total: 0, passed: 0, failed: 0, not_run: 0 };
        var layers = status.layers || {};

        ['frontend', 'api', 'cli'].forEach(function (key) {
            var layer = layers[key] || {};
            totals.total += numberValue(layer.total) || 0;
            totals.passed += numberValue(layer.passed) || 0;
            totals.failed += numberValue(layer.failed) || 0;
            totals.not_run += numberValue(layer.not_run) || 0;
        });

        totals.pass_rate = totals.total > 0 ? totals.passed / totals.total * 100 : 0;

        return totals.total > 0 ? totals : null;
    }

    function caseCountOf(status) {
        var totals = totalsOf(status);
        if (totals) { return totals.total; }

        var count = 0;
        ['frontend', 'api', 'cli'].forEach(function (key) {
            var layer = status.layers && status.layers[key];
            if (layer && Array.isArray(layer.cases)) { count += layer.cases.length; }
        });

        return count;
    }

    function hasAnyCases(status) {
        var layers = status.layers || {};
        return ['frontend', 'api', 'cli'].some(function (key) {
            return layers[key] && Array.isArray(layers[key].cases) && layers[key].cases.length > 0;
        });
    }

    function layerCountText(layer) {
        if (!layer) { return '0'; }
        if (layer.state === 'skipped') { return '未参与'; }
        var total = numberValue(layer.total) || 0;
        if (total === 0) { return layer.state === 'running' ? '执行中' : '0'; }
        return (numberValue(layer.passed) || 0) + '/' + total;
    }

    function layerChips(status) {
        var layers = status.layers || {};
        return ['frontend', 'api', 'cli'].map(function (key) {
            var layer = layers[key] || {};
            var state = layer.state || 'pending';
            var failed = numberValue(layer.failed) || 0;
            return '<span class="layer-chip ' + esc(state) + '" title="' + esc(LAYER_STATES[state] || state) + '">'
                + esc((layer.name || LAYER_LABELS[key]) + '用例')
                + ' <strong>' + esc(layerCountText(layer)) + '</strong>'
                + (failed ? '<em>失败 ' + failed + '</em>' : '')
                + '</span>';
        }).join('');
    }

    function coverageBadges(status) {
        var coverage = status.coverage || {};
        var badges = [];

        if (coverage.php_business) {
            badges.push('<span>PHP ' + esc(pctText(coverage.php_business.percent)) + '</span>');
        }

        if (coverage.js) {
            badges.push('<span>JS ' + esc(pctText(coverage.js.percent)) + '</span>');
        }

        var delta = status.coverage_delta;
        if (delta) {
            ['php_business', 'js'].forEach(function (key) {
                var value = numberValue(delta[key]);
                if (value === null) { return; }
                badges.push('<span class="badge ' + (value >= 0 ? 'ok' : 'err') + '">'
                    + (key === 'php_business' ? 'PHP' : 'JS') + ' Δ '
                    + (value >= 0 ? '+' : '') + value.toFixed(2) + 'pp</span>');
            });
        }

        return badges;
    }

    function auditBadges(status) {
        var badges = [];
        var pageFirst = status.page_first;

        if (pageFirst) {
            badges.push(pageFirst.unclassified > 0
                ? '<span class="badge warn">页面穿透未分类 ' + pageFirst.unclassified + '</span>'
                : '<span class="badge ok">页面穿透通过</span>');
        }

        var dataCheck = status.data_check;
        if (dataCheck) {
            badges.push(dataCheck.unverified > 0
                ? '<span class="badge warn">落库未校验 ' + dataCheck.unverified + '</span>'
                : '<span class="badge ok">落库校验通过</span>');
        }

        var designCheck = status.design_check;
        if (designCheck) {
            if (designCheck.violations && designCheck.violations.length) {
                badges.push('<span class="badge warn">设计元数据异常 ' + designCheck.violations.length + '</span>');
            } else if (designCheck.metadata_cases > 0) {
                badges.push('<span class="badge ok">设计元数据通过</span>');
            }
        }

        return badges;
    }

    function totalsBadge(status) {
        var totals = totalsOf(status);
        if (!totals) { return ''; }
        var label = isActiveRound(status) ? '当前通过率' : '全量通过率';
        return '<span class="badge ' + (totals.failed || totals.not_run ? 'err' : 'ok') + '">' + label + ' '
            + pctText(totals.pass_rate) + '（' + totals.passed + '/' + totals.total + '）</span>';
    }

    function roundTimeParts(status, active) {
        var parts = [];
        var started = absoluteTime(status.started_at);
        if (started) { parts.push('开始 ' + started); }

        var start = startTime(status.started_at);
        var end = active ? Date.now() : startTime(status.updated_at);

        if (start && end >= start) {
            parts.push((active ? '已运行 ' : '用时 ') + durationText((end - start) / 1000));
        }

        if (active) {
            var updated = clockTime(status.updated_at);
            if (updated) { parts.push('状态更新 ' + updated); }
        }

        return parts;
    }

    function currentDetail(status) {
        var parts = [];

        if (status.message) { parts.push(status.message); }

        ['frontend', 'api', 'cli'].forEach(function (key) {
            var layer = status.layers && status.layers[key];
            if (layer && layer.state === 'running' && layer.current_step) {
                parts.push(layer.current_step);
            }
        });

        if (!parts.length && status.state === 'planning') {
            parts.push('正在编写本轮用例；开始执行后自动更新进度');
        }

        if (!parts.length && status.state === 'done') {
            parts.push('本轮已归档，可查看全量报告、覆盖率与下一轮补测计划');
        }

        return parts.join(' · ');
    }

    function stepStats(meta) {
        var steps = meta && Array.isArray(meta.steps) ? meta.steps : [];
        var passed = steps.filter(function (step) { return step.status === 'ok'; }).length;
        var failed = steps.length - passed;

        return {
            total: steps.length,
            passed: passed,
            failed: failed,
            rateLabel: steps.length > 0 ? (passed / steps.length * 100).toFixed(2) + '%' : '—'
        };
    }

    function traceLink(name, label) {
        var href = '/trace/index.html?trace=' + encodeURIComponent('/artifacts/runs/' + name + '/trace.zip');
        return '<a class="btn" href="' + href + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
    }

    function actionLink(href, label) {
        return '<a class="btn" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
    }

    function caseButton(index, label, expandedNow) {
        return '<button class="btn" type="button" data-index="' + index + '" aria-expanded="' + (expandedNow ? 'true' : 'false') + '">'
            + esc(expandedNow ? '收起用例' : label) + '</button>';
    }

    function renderCaseList(cases) {
        if (!cases.length) {
            return '<div class="run-note">该层没有记录用例。</div>';
        }

        var html = '<ol class="steps-list">';

        for (var i = 0; i < cases.length; i++) {
            var item = cases[i];
            var failed = item.status === 'failed';
            var notRun = item.status === 'not_run';
            var icon = failed ? '✕' : (notRun ? '•' : '✓');
            var notes = [];

            if (failed || notRun) {
                var expected = item.expected ? '期望：' + item.expected : '';
                var actual = item.actual ? '实际：' + item.actual : '';
                notes.push('<span class="case-failure">' + esc([expected, actual].filter(Boolean).join(' · ').slice(0, 600)) + '</span>');
            }

            var designNotes = [];

            if (item.case_id) { designNotes.push('编号：' + item.case_id); }
            if (item.design_method) { designNotes.push('设计方法：' + item.design_method); }
            if (item.test_unit) { designNotes.push('测试单元：' + item.test_unit); }
            if (item.test_point) { designNotes.push('测试点：' + item.test_point); }

            if (designNotes.length) {
                notes.push('<span class="case-note">' + esc(designNotes.join(' · ')) + '</span>');
            }

            notes.push('<span class="case-note">操作步骤：' + esc(item.operation_steps || '历史用例未记录') + '</span>');

            if (item.via_page) {
                notes.push('<span class="case-note">穿透页面：' + esc(item.via_page) + '</span>');
            } else if (item.unreachable_reason) {
                notes.push('<span class="case-note">页面不可达：' + esc(item.unreachable_reason) + '</span>');
            }

            if (item.mutates_data) {
                notes.push(item.db_verification
                    ? '<span class="case-note ok">落库已校验</span>'
                    : '<span class="case-note err">落库未校验</span>');
            }

            html += '<li class="step' + (failed ? ' error' : (notRun ? ' not-run' : '')) + '">'
                + '<span class="step-icon">' + icon + '</span>'
                + '<span class="step-name">' + esc(item.name) + notes.join('') + '</span>'
                + '<span class="step-time">' + esc(durationMs(item.duration_ms)) + '</span>'
                + '</li>';
        }

        html += '</ol>';
        return html;
    }

    function layerEmptyText(layer) {
        if (!layer || layer.state === 'pending') { return '等待执行。'; }
        if (layer.state === 'skipped') { return '本轮不包含该层测试。'; }
        if (layer.state === 'running') { return '执行中；用例明细在本层结束后写入。'; }
        return '该层没有记录用例。';
    }

    function renderLayers(layers) {
        var html = '';

        ['frontend', 'api', 'cli'].forEach(function (key) {
            var layer = (layers && layers[key]) || {};
            var cases = Array.isArray(layer.cases) ? layer.cases : [];
            var title = esc((layer.name || LAYER_LABELS[key]) + '用例') + ' '
                + esc(layerCountText(layer))
                + (layer.failed ? ' · 失败 ' + numberValue(layer.failed) : '')
                + (layer.not_run ? ' · 未执行 ' + numberValue(layer.not_run) : '')
                + (LAYER_STATES[layer.state] ? ' · ' + LAYER_STATES[layer.state] : '');

            html += '<div class="case-layer">'
                + '<div class="case-layer-title">' + title + '</div>'
                + (cases.length ? renderCaseList(cases) : '<div class="run-note">' + esc(layerEmptyText(layer)) + '</div>')
                + '</div>';
        });

        return html;
    }

    function renderAudits(status) {
        var html = '';
        var pageFirst = status.page_first;

        if (pageFirst) {
            html += '<div class="run-issues"><strong>页面穿透审计</strong>'
                + ' 页面用例 ' + pageFirst.frontend_cases
                + ' · 接口 / CLI ' + pageFirst.api_cli_cases
                + ' · 已关联页面 ' + pageFirst.via_page
                + ' · 不可达说明 ' + pageFirst.unreachable
                + ' · 未分类 ' + pageFirst.unclassified;

            if (pageFirst.violations && pageFirst.violations.length) {
                html += '<ul>' + pageFirst.violations.slice(0, 30).map(function (item) {
                    return '<li>[' + esc(item.layer) + '] ' + esc(item.name) + ' — ' + esc(item.reason) + '</li>';
                }).join('') + '</ul>';
            } else {
                html += '<div class="ok-text">全部接口 / CLI 用例都已关联页面用例或说明页面不可达原因。</div>';
            }

            html += '</div>';
        }

        var dataCheck = status.data_check;

        if (dataCheck) {
            html += '<div class="run-issues"><strong>数据落库校验</strong>'
                + ' 写数据用例 ' + dataCheck.mutating_cases
                + ' · 已校验 ' + dataCheck.verified
                + ' · 未校验 ' + dataCheck.unverified;

            if (dataCheck.violations && dataCheck.violations.length) {
                html += '<ul>' + dataCheck.violations.slice(0, 30).map(function (item) {
                    return '<li>[' + esc(item.layer) + '] ' + esc(item.name) + ' — ' + esc(item.reason) + '</li>';
                }).join('') + '</ul>';
            } else {
                html += '<div class="ok-text">全部已标记为写数据的用例都记录了数据库落库校验。</div>';
            }

            html += '</div>';
        }

        var designCheck = status.design_check;

        if (designCheck) {
            var methods = designCheck.method_counts || {};
            var methodText = Object.keys(methods).map(function (key) { return key + ' ' + methods[key]; }).join(' · ') || '暂无';
            html += '<div class="run-issues"><strong>用例设计元数据</strong>'
                + ' 带元数据 ' + designCheck.metadata_cases + ' / ' + designCheck.total_cases
                + ' · 带操作步骤 ' + designCheck.operation_steps_cases
                + ' · 设计方法 ' + esc(methodText);

            if (designCheck.violations && designCheck.violations.length) {
                html += '<ul>' + designCheck.violations.slice(0, 30).map(function (item) {
                    return '<li>[' + esc(item.layer) + '] ' + esc(item.name) + ' — ' + esc(item.reason) + '</li>';
                }).join('') + '</ul>';
            } else {
                html += '<div class="ok-text">已提供的设计元数据自洽。</div>';
            }

            if (designCheck.units_without_positive && designCheck.units_without_positive.length) {
                html += '<div class="run-note">只有负向用例的测试单元：'
                    + esc(designCheck.units_without_positive.slice(0, 20).map(function (unit) { return unit.test_unit; }).join('、'))
                    + '</div>';
            }

            html += '</div>';
        }

        return html;
    }

    function renderIssues(meta) {
        if (!meta) { return ''; }

        var pageErrors = Array.isArray(meta.page_errors) ? meta.page_errors : [];
        var consoleErrors = Array.isArray(meta.console_errors) ? meta.console_errors : [];

        if (!pageErrors.length && !consoleErrors.length) { return ''; }

        var html = '<div class="run-issues"><strong>运行期错误</strong><ul>';

        pageErrors.forEach(function (item) {
            html += '<li>页面：' + esc(item.page_url || '') + ' · ' + esc(item.message || '') + '</li>';
        });

        consoleErrors.forEach(function (item) {
            html += '<li>Console：' + esc(typeof item === 'string' ? item : (item.text || JSON.stringify(item))) + '</li>';
        });

        return html + '</ul></div>';
    }

    function renderRoundPanel(item) {
        var status = item.status;
        var meta = item.meta;
        var totals = totalsOf(status);
        var head = [];

        if (totals) {
            head.push('<span>' + (isActiveRound(status) ? '当前通过率' : '全量通过率') + ' <strong>' + esc(pctText(totals.pass_rate)) + '</strong>（'
                + totals.passed + '/' + totals.total + '）</span>');
            head.push('<span>失败 ' + totals.failed + '</span>');
            head.push('<span>未执行 ' + totals.not_run + '</span>');
        }

        if (status.coverage_scope) {
            head.push('<span>覆盖口径：PHP ' + esc(status.coverage_scope.php || '本轮全部执行')
                + '；JS ' + esc(status.coverage_scope.js || '本轮全部页面流程') + '</span>');
        }

        if (meta && meta.flow) {
            head.push('<span>流程：<code>' + esc(meta.flow) + '</code></span>');
        }

        if (item.runs && item.runs.length) {
            head.push('<span>运行：<code>' + esc(item.runs.map(function (run) { return run.name; }).join('、')) + '</code></span>');
        }

        return '<div class="steps-head">' + head.join('') + '</div>'
            + renderLayers(status.layers)
            + renderAudits(status)
            + renderIssues(meta);
    }

    function renderMetaPanel(meta) {
        var steps = Array.isArray(meta.steps) ? meta.steps : [];
        var stats = stepStats(meta);
        var html = '<div class="steps-head">'
            + '<span>前端用例通过率 <strong>' + esc(stats.rateLabel) + '</strong>（' + stats.passed + '/' + stats.total + '）</span>'
            + '<span>失败 ' + stats.failed + '</span>'
            + '<span>流程文件：<code>' + esc(meta.flow || '未记录') + '</code></span>'
            + '</div>';

        html += renderCaseList(steps.map(function (step) {
            return {
                name: step.name,
                status: step.status === 'ok' ? 'passed' : 'failed',
                duration_ms: step.duration_ms,
                expected: '',
                actual: step.error || ''
            };
        }));

        return html + renderIssues(meta);
    }

    function renderLegacyRoundPanel(item) {
        var meta = item.meta;
        var summary = item.round;

        if (!meta) {
            return '<div class="run-note">该轮次没有生成 meta.json（可能被中断），无法回看步骤与结果。</div>';
        }

        if (summary && summary.layers) {
            return renderRoundPanel({
                status: {
                    round_id: summary.round_id || item.run.name,
                    state: 'done',
                    layers: summary.layers,
                    totals: summary.totals,
                    coverage: summary.coverage,
                    coverage_scope: summary.coverage_scope,
                    coverage_delta: summary.coverage_delta,
                    page_first: summary.page_first,
                    data_check: summary.data_check,
                    design_check: summary.design_check
                },
                runs: [item.run],
                meta: meta
            });
        }

        return renderMetaPanel(meta);
    }

    function actionButtons(item, index) {
        var actions = [];

        if (item.kind === 'round') {
            var status = item.status;
            var reportUrl = status.report_url;

            if (!reportUrl && status.summary_path && (status.state === 'done' || status.state === 'failed')) {
                reportUrl = '/rounds/' + encodeURIComponent(status.round_id) + '/report/index.html';
            }

            if (reportUrl) { actions.push(actionLink(reportUrl, '全量测试报告')); }
            if (status.plan_url) { actions.push(actionLink(status.plan_url, '下一轮补测计划')); }

            (item.runs || []).forEach(function (run, runIndex) {
                if (!run.meta) { return; }
                var label = item.runs.length > 1 ? 'Trace ' + (runIndex + 1) : 'Trace Viewer';
                actions.push(traceLink(run.name, label));
            });

            var count = caseCountOf(status);

            if (count > 0 || hasAnyCases(status)) {
                actions.push(caseButton(index, (status.totals ? '全量用例' : '用例') + '（' + count + '）', !!expanded[item.key]));
            }

            return actions.join('');
        }

        var meta = item.meta;
        var round = item.round;
        var actionsHtml = [];

        if (meta) {
            actionsHtml.push(traceLink(item.run.name, 'Trace Viewer'));

            var caseCount = round && round.totals ? round.totals.total : (meta.steps ? meta.steps.length : 0);
            var caseLabel = (round ? '全量用例（' : '前端用例（') + caseCount + '）';
            actionsHtml.push(caseButton(index, caseLabel, !!expanded[item.key]));

            if (round) {
                actionsHtml.push(actionLink('/artifacts/runs/' + encodeURIComponent(item.run.name) + '/round/index.html', '全量测试报告'));
            }
        } else {
            actionsHtml.push(actionLink('/artifacts/runs/' + encodeURIComponent(item.run.name) + '/', '产物目录'));
        }

        return actionsHtml.join('');
    }

    function renderCard(item, index) {
        var active = item.kind === 'round' && isActiveRound(item.status);
        var head = [];
        var detail = '';
        var error = '';

        if (item.kind === 'round') {
            var status = item.status;

            head.push('<span class="run-id">' + esc(status.round_id) + '</span>');
            head.push('<span class="badge ' + roundStateClass(status) + '">' + esc(stateLabel(status)) + '</span>');

            if (status.name && status.name !== 'round') {
                head.push('<span class="badge dim">' + esc(status.name) + '</span>');
            }

            roundTimeParts(status, active).forEach(function (part) { head.push('<span>' + esc(part) + '</span>'); });
            head.push(totalsBadge(status));
            coverageBadges(status).forEach(function (badge) { head.push(badge); });
            auditBadges(status).forEach(function (badge) { head.push(badge); });

            detail = currentDetail(status);

            if (status.error) {
                error = '<div class="run-error">' + esc(status.error) + '</div>';
            } else if (item.meta && item.meta.error) {
                error = '<div class="run-error">失败于：' + esc(item.meta.error.step || '未知步骤');
                if (item.meta.error.message) { error += ' · ' + esc(item.meta.error.message); }
                error += '</div>';
            }
        } else {
            var meta = item.meta;
            var round = item.round;

            head.push('<span class="run-id">' + esc(item.run.name) + '</span>');

            if (!meta) {
                head.push('<span class="badge warn">未完成</span>');
            } else if (meta.error) {
                head.push('<span class="badge err">失败</span>');
            } else {
                head.push('<span class="badge ok">成功</span>');
            }

            if (meta) {
                var start = startTime(meta.started_at);
                var end = startTime(meta.finished_at);

                if (start && end >= start) { head.push('<span>' + durationText((end - start) / 1000) + '</span>'); }

                var started = absoluteTime(meta.started_at);
                if (started) { head.push('<span>' + esc(started) + '</span>'); }

                if (round && round.totals) {
                    head.push('<span class="badge ' + (round.totals.failed || round.totals.not_run ? 'err' : 'ok') + '">全量通过率 '
                        + pctText(round.totals.pass_rate) + '（' + round.totals.passed + '/' + round.totals.total + '）</span>');
                    coverageBadges({ coverage: round.coverage || {} }).forEach(function (badge) { head.push(badge); });
                } else {
                    var stats = stepStats(meta);

                    if (stats.total > 0) {
                        head.push('<span class="badge ' + (stats.failed ? 'err' : 'ok') + '">前端用例通过率 '
                            + esc(stats.rateLabel) + '（' + stats.passed + '/' + stats.total + '）</span>');
                    }

                    var lines = meta.coverage && meta.coverage.totals && meta.coverage.totals.lines;
                    if (lines && lines.pct) { head.push('<span>前端行覆盖 ' + esc(lines.pct) + '</span>'); }
                }

                if (meta.error) {
                    error = '<div class="run-error">失败于：' + esc(meta.error.step || '未知步骤');
                    if (meta.error.message) { error += ' · ' + esc(meta.error.message); }
                    error += '</div>';
                } else if (round && round.totals && (round.totals.failed || round.totals.not_run)) {
                    error = '<div class="run-error">全量失败 ' + round.totals.failed + ' 条，未执行 ' + round.totals.not_run + ' 条</div>';
                }
            } else {
                error = '<div class="run-note">该轮次没有生成 meta.json（可能被中断），无法回看步骤与结果。</div>';
            }
        }

        return '<article class="run' + (active ? ' active' : '') + '" data-index="' + index + '">'
            + '<div class="run-row">'
            + '<div class="run-main"><div class="run-head">' + head.join('') + '</div>'
            + (item.kind === 'round' ? '<div class="layers">' + layerChips(item.status) + '</div>' : '')
            + (detail ? '<div class="round-detail">' + esc(detail) + '</div>' : '')
            + error
            + '</div>'
            + '<div class="run-actions">' + actionButtons(item, index) + '</div>'
            + '</div>'
            + '<div class="steps-panel" hidden></div>'
            + '</article>';
    }

    function render() {
        if (!items.length) {
            runsBox.innerHTML = '<div class="empty">还没有测试轮次。开始一轮时先执行 '
                + '<code>round-status start --name=round --suite-dir=/var/www/test_usecase</code>，'
                + '编写用例期间就会出现在这里。</div>';
            return;
        }

        var html = items.map(renderCard).join('');

        if (omittedLegacy > 0) {
            html += '<div class="run-note">另有 ' + omittedLegacy + ' 条更早的 Playwright 运行未展示，可在 '
                + '<a href="/artifacts/" target="_blank" rel="noopener">/artifacts/</a> 查看。</div>';
        }

        runsBox.innerHTML = html;

        Object.keys(expanded).forEach(function (key) {
            if (!expanded[key]) { return; }

            var index = items.findIndex(function (item) { return item.key === key; });
            if (index < 0) { return; }

            var article = runsBox.querySelector('[data-index="' + index + '"]');
            var panel = article && article.querySelector('.steps-panel');
            if (!panel) { return; }

            panel.innerHTML = items[index].kind === 'round'
                ? renderRoundPanel(items[index])
                : renderLegacyRoundPanel(items[index]);
            panel.hidden = false;
        });
    }

    function anyActive() {
        return items.some(function (item) {
            return item.kind === 'round' && isActiveRound(item.status);
        });
    }

    function schedule() {
        if (timer) { clearTimeout(timer); }
        timer = setTimeout(loadData, anyActive() ? 3000 : 15000);
    }

    function fetchJson(url) {
        return fetch(url, { cache: 'no-store' })
            .then(function (resp) { return resp.ok ? resp.json() : null; })
            .catch(function () { return null; });
    }

    function directoryNames(entries) {
        return (Array.isArray(entries) ? entries : [])
            .filter(function (entry) { return entry && entry.type === 'directory' && entry.name; })
            .map(function (entry) { return entry.name; })
            .sort()
            .reverse();
    }

    function fetchRun(name) {
        if (runCache[name]) { return Promise.resolve(runCache[name]); }

        return Promise.all([
            fetchJson('/artifacts/runs/' + encodeURIComponent(name) + '/meta.json'),
            fetchJson('/artifacts/runs/' + encodeURIComponent(name) + '/round/summary.json')
        ]).then(function (values) {
            var run = { name: name, meta: values[0], round: values[1] };

            // 运行结束且全量摘要已生成后不再变化；摘要可能稍后才复制过来，未就绪时下轮继续读取
            if (run.meta && run.meta.finished_at && run.round) { runCache[name] = run; }

            return run;
        });
    }

    function referencedRunNames(rounds) {
        var names = {};

        rounds.forEach(function (round) {
            var runs = Array.isArray(round.status.playwright_runs) ? round.status.playwright_runs : [];
            runs.forEach(function (run) { names[runNameOf(run)] = true; });
        });

        delete names[''];

        return names;
    }

    function runNameOf(path) {
        return String(path || '').split('/').filter(Boolean).pop() || '';
    }

    function mergeItems(rounds, runs) {
        var runByName = {};
        var referenced = {};
        var merged = [];

        runs.forEach(function (run) { runByName[run.name] = run; });

        rounds.forEach(function (round) {
            var status = round.status;
            var runNames = Array.isArray(status.playwright_runs)
                ? status.playwright_runs.map(runNameOf).filter(Boolean)
                : [];
            var roundRuns = runNames.map(function (name) {
                return runByName[name] || { name: name, meta: null, round: null };
            });
            var latest = roundRuns[roundRuns.length - 1] || null;

            runNames.forEach(function (name) { referenced[name] = true; });

            merged.push({
                key: 'round:' + status.round_id,
                kind: 'round',
                status: status,
                runs: roundRuns,
                run: latest,
                meta: latest ? latest.meta : null
            });
        });

        runs.forEach(function (run) {
            if (referenced[run.name]) { return; }

            merged.push({
                key: 'run:' + run.name,
                kind: 'run',
                run: run,
                meta: run.meta,
                round: run.round,
                status: null,
                runs: [run]
            });
        });

        return merged.sort(function (a, b) {
            var aTime = a.kind === 'round'
                ? startTime(a.status.started_at)
                : (a.meta ? startTime(a.meta.started_at) : 0);
            var bTime = b.kind === 'round'
                ? startTime(b.status.started_at)
                : (b.meta ? startTime(b.meta.started_at) : 0);

            return bTime - aTime;
        });
    }

    function loadData() {
        if (loading) { return; }
        loading = true;

        Promise.all([
            fetchJson('/rounds-json/'),
            fetchJson('/runs-json/')
        ]).then(function (indexes) {
            var roundNames = directoryNames(indexes[0]);
            var runNames = directoryNames(indexes[1]);

            // 先读轮次状态，确定本轮引用了哪些 Playwright 运行；
            // 旧运行只取最近的若干条，避免轮询时把全部历史 meta 都拉一遍。
            return Promise.all(roundNames.map(function (name) {
                return fetchJson('/rounds/' + encodeURIComponent(name) + '/status.json')
                    .then(function (status) { return status ? { name: name, status: status } : null; });
            })).then(function (rounds) {
                rounds = rounds.filter(Boolean);

                var referenced = referencedRunNames(rounds);
                var legacyNames = runNames.filter(function (name) { return !referenced[name]; });
                var legacyShown = legacyNames.slice(0, MAX_LEGACY_RUNS);
                var fetchNames = Object.keys(referenced).concat(legacyShown);
                var uniqueNames = [];

                fetchNames.forEach(function (name) {
                    if (name && uniqueNames.indexOf(name) < 0) { uniqueNames.push(name); }
                });

                omittedLegacy = Math.max(0, runNames.length - Object.keys(referenced).filter(function (name) {
                    return runNames.indexOf(name) >= 0;
                }).length - legacyShown.length);

                return Promise.all(uniqueNames.map(fetchRun)).then(function (runs) {
                    return { rounds: rounds, runs: runs };
                });
            });
        }).then(function (values) {
            var rounds = values.rounds;
            var runs = values.runs;
            var nextSignature = JSON.stringify({
                rounds: rounds.map(function (round) { return round.status; }),
                runs: runs.map(function (run) { return [run.name, run.meta, run.round]; }),
                omitted: omittedLegacy
            });
            var wasActive = anyActive();

            items = mergeItems(rounds, runs);

            var keys = {};
            items.forEach(function (item) { keys[item.key] = true; });
            Object.keys(expanded).forEach(function (key) {
                if (!keys[key]) { delete expanded[key]; }
            });

            if (wasActive || nextSignature !== signature) {
                signature = nextSignature;
                render();
            }

            schedule();
        }).catch(function (error) {
            if (!items.length) {
                runsBox.innerHTML = '<div class="empty">测试轮次读取失败：' + esc(error.message) + '</div>';
            }
            schedule();
        }).then(function () {
            loading = false;
        });
    }

    runsBox.addEventListener('click', function (event) {
        var button = event.target.closest('button[data-index]');
        if (!button) { return; }

        var index = Number(button.getAttribute('data-index'));
        var item = items[index];
        if (!item) { return; }

        expanded[item.key] = !expanded[item.key];
        render();
    });

    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { loadData(); }
    });

    loadData();
})();
</script>
</body>
</html>
