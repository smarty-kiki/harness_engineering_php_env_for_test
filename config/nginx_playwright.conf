# 前端测试观测入口：独立监听 8080，不占用项目自身的 80 端口。
# 宿主机访问需要启动容器时加 -p 8080:8080。

server {
    listen 8080;
    server_name _;
    charset utf-8;

    # 打开根地址直接进只读 live view
    location = / {
        return 302 /vnc/vnc.html?autoconnect=true&resize=scale&view_only=true;
    }

    # noVNC（websockify 自带静态页），WebSocket 走同一路径
    location ^~ /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # 运行产物：/artifacts/latest/ 是最近一次运行，/artifacts/runs/ 是历史运行
    location ^~ /artifacts/ {
        alias /var/log/harness-coverage/playwright/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    # 最近一次运行的 HTML 覆盖率报告
    location ^~ /coverage/ {
        alias /var/log/harness-coverage/playwright/latest/report/;
        index index.html;
        autoindex on;
        add_header Cache-Control "no-store";
    }

    # Playwright Trace Viewer（由 playwright-run 启动，监听回环 9323）
    # 入口 /trace、/trace/ 转发到 viewer 根路径（它会跳到 /trace/index.html），
    # 其余 /trace/... 保留前缀转发，和 viewer 自己的路由一致。
    location = /trace {
        proxy_pass http://127.0.0.1:9323/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9323;
    }

    # viewer 的入口跳转是相对路径，带斜杠访问会拼成 /trace/trace/…，
    # 统一先回到 /trace 再跳转，保证地址干净
    location = /trace/ {
        return 302 /trace;
    }

    location ^~ /trace/ {
        proxy_pass http://127.0.0.1:9323;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9323;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
}
