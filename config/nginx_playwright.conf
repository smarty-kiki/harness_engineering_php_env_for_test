# 测试观测入口：独立监听 8080，不占用项目自身的 80 端口。
# 实时画面、运行产物、前端/后端覆盖率、Trace Viewer 都在这里。
# 宿主机访问需要启动容器时加 -p 8080:8080。

server {
    listen 8080;
    server_name _;
    charset utf-8;
    # 宿主映射到其他端口（如 -p 18080:8080）时，重定向仍留在当前端口
    absolute_redirect off;

    # 根地址：观测入口目录页，集中列出实时画面、产物、覆盖率与 trace
    location = / {
        root /usr/local/share/harness/coverage;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # 便捷入口：直接进只读 live view（等价于页面里的「实时画面」）
    location = /live {
        return 302 /vnc/vnc.html?autoconnect=true&resize=scale&view_only=true;
    }

    location = /live/ {
        return 302 /live;
    }

    # noVNC（websockify 自带静态页），WebSocket 走同一路径
    location ^~ /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # 轮次注册目录：状态、摘要、报告与补测计划都以轮次为单位归档。
    # /rounds-json/ 供 8080 轮询发现新轮次；/rounds/ 提供 status.json、plan.md 与 report/。
    location = /rounds.json {
        return 302 /rounds-json/;
    }

    location ^~ /rounds-json/ {
        alias /var/log/harness-coverage/rounds/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    location ^~ /rounds/ {
        alias /var/log/harness-coverage/rounds/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    # Playwright 单次运行列表（JSON）：兼容没有轮次记录的历史产物
    location = /runs.json {
        return 302 /runs-json/;
    }

    location ^~ /runs-json/ {
        alias /var/log/harness-coverage/playwright/runs/;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    # 运行产物：/artifacts/latest/ 是最近一次运行，/artifacts/runs/ 是历史运行
    location ^~ /artifacts/ {
        alias /var/log/harness-coverage/playwright/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    # 最近一次运行的 JS（V8）HTML 覆盖率报告，与 /php-coverage/ 对称
    location = /js-coverage {
        return 302 /js-coverage/;
    }

    location ^~ /js-coverage/ {
        alias /var/log/harness-coverage/playwright/latest/report/;
        index index.html;
        autoindex on;
        add_header Cache-Control "no-store";
    }

    # 后端 PHP 覆盖率 HTML 报告（coverage-report --html 省略目录时发布到这里）
    location = /php-coverage {
        return 302 /php-coverage/;
    }

    location ^~ /php-coverage/ {
        alias /var/log/harness-coverage/php-report/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "no-store";
    }

    # 覆盖率总览：同一页切换前端 / 后端报告
    location = /reports {
        return 302 /reports/;
    }

    location ^~ /reports/ {
        alias /usr/local/share/harness/coverage/reports/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # Playwright Trace Viewer（由 playwright-run 启动，监听回环 9323）
    # 入口 /trace、/trace/ 转发到 viewer 根路径（它会跳到 /trace/index.html），
    # 其余 /trace/... 保留前缀转发，和 viewer 自己的路由一致。
    location = /trace {
        proxy_pass http://127.0.0.1:9323/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9323;
    }

    # viewer 的入口跳转是相对路径，带斜杠访问会拼成 /trace/trace/…，
    # 统一先回到 /trace 再跳转，保证地址干净
    location = /trace/ {
        return 302 /trace;
    }

    location ^~ /trace/ {
        proxy_pass http://127.0.0.1:9323;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9323;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store";
    }
}
