# ~/.tmuxinator/init.yml

# start 里 export 的已启用可选组件列表，用来做窗口条件渲染（tmuxinator 会先把项目文件当 ERB 执行再解析 YAML）
<% enabled_components = (ENV['ENABLED_COMPONENTS'] || '').split(',') %>

name: init
root: /var/www

windows:
  - claude:
      layout: even-horizontal
      panes:
        - list:
          - printf '\033]2;%s\033\\' 'claude'
          - cd $PRJ_HOME
          - clear
          - sleep 1
          - CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS=1 CLAUDE_CODE_DISABLE_WORKFLOWS=1 CLAUDE_AUTOCOMPACT_PCT_OVERRIDE=50 CLAUDE_CODE_AUTO_COMPACT_WINDOW=1000000 claude --permission-mode acceptEdits --allowedTools "Read,Write,Edit,Bash,Git,Npm,Pip,Rm,Grep,Glob" --append-system-prompt "`cat /tmp/append_system_prompt.md 2>/dev/null || cat /root/.append_system_prompt.md`"
  - bash:
      layout: even-horizontal
      panes:
        - list:
          - printf '\033]2;%s\033\\' 'bash'
          - cd $PRJ_HOME
          - clear
  - nginx-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'access-log'
            - clear
            - tail -n 100 -F /var/log/nginx/access.log | perl -pe 's/("status":(?:200|304)\b|\s(?:200|304)\s)/\e[1;34m$1\e[0m/g; s/("status":(?:500|502|503)\b|\s(?:500|502|503)\s)/\e[1;31m$1\e[0m/g'
        - list:
            - printf '\033]2;%s\033\\' 'error-log'
            - clear
            - tail -n 100 -F /var/log/nginx/error.log | perl -pe 's/(DEBUG)|(INFO)|(ERROR|EXCEPTION)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
  - php-fpm-logs:
      layout: even-horizontal
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'fpm-log'
            - clear
            - tail -n 100 -F /var/log/php-fpm.log | perl -pe 's/(NOTICE)|(STRICT)|(ERROR|EXCEPTION)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
  - php-code-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'exception-log'
            - clear
            - tail -n 100 -F /tmp/php_exception.log | perl -pe 's/(DEBUG)|(INFO)|(ERROR|EXCEPTION)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
        - list:
            - printf '\033]2;%s\033\\' 'notice-log'
            - clear
            - tail -n 100 -F /tmp/php_notice.log | perl -pe 's/(DEBUG)|(INFO)|(ERROR|EXCEPTION)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
        - list:
            - printf '\033]2;%s\033\\' 'module-log'
            - clear
            - tail -n 100 -F /tmp/php_module.log | perl -pe 's/(DEBUG)|(INFO)|(ERROR|EXCEPTION)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
  - mysql-logs:
      layout: even-horizontal
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'error-log'
            - clear
            - tail -n 100 -F /var/log/mysql/error.log | perl -pe 's/(Note)|(Warning)|(Error)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
  - mysql-sql-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'slow-sql-log'
            - clear
            - tail -n 100 -F /var/log/mysql/slow.log | perl -pe 's/(explain)|(Using where)|(Yes)|(No)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m\e[1;32m$4\e[0m/g'
        - list:
            - printf '\033]2;%s\033\\' 'sql-log'
            - clear
            - tail -n 100 -F /var/log/mysql/mysql.log | perl -pe 's/(Close stmt|Quit|Connect)|(Execute)|(ROLLBACK)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
<% if enabled_components.include?('clickhouse') %>
  - clickhouse-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'clickhouse-log'
            - clear
            - tail -n 100 -F /var/log/clickhouse-server/clickhouse-server.log | perl -pe 's/(<Trace>|<Debug>)|(<Information>|<Warning>)|(<Error>|<Fatal>)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
        - list:
            - printf '\033]2;%s\033\\' 'clickhouse-err-log'
            - clear
            - tail -n 100 -F /var/log/clickhouse-server/clickhouse-server.err.log | perl -pe 's/(<Trace>|<Debug>)|(<Information>|<Warning>)|(<Error>|<Fatal>)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
<% end %>
<% if enabled_components.include?('kafka') %>
  - kafka-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'kafka-server-log'
            - clear
            - tail -n 100 -F /var/log/kafka/server.log | perl -pe 's/(DEBUG)|(INFO)|(WARN)|(ERROR|FATAL)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
        - list:
            - printf '\033]2;%s\033\\' 'kafka-controller-log'
            - clear
            - tail -n 100 -F /var/log/kafka/controller.log | perl -pe 's/(DEBUG)|(INFO)|(WARN)|(ERROR|FATAL)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
<% end %>
  - redis-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'redis-log'
            - clear
            - tail -n 100 -F /var/log/redis/redis-server.log | perl -pe 's/(DEBUG)|(INFO|WARNING)|(ERROR|EXCEPTION)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
        - list:
            - printf '\033]2;%s\033\\' 'action-log'
            - clear
            - redis-cli monitor | tee /var/log/redis/redis-cli.log | perl -pe 's/(GET|SET)|(KEYS)|(HGET|HSET)/\e[1;34m$1\e[0m\e[1;33m$2\e[0m\e[1;31m$3\e[0m/gi'
  - cda-logs:
      layout: even-vertical
      panes:
        - list:
            - printf '\033]2;%s\033\\' 'cda-log'
            - clear
            - tail -n 100 -F /tmp/chrome/supervisor-*.log
